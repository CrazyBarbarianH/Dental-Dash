<style>

html,body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif}
body{display:flex;justify-content:center;padding:8px;background:#1b1035 linear-gradient(45deg,#ffffff0a 25%,#0000 25% 75%,#ffffff0a 75%) 0 0/16px 16px}
#wrap{width:100%;max-width:960px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;font:10px "Press Start 2P",monospace;color:var(--acc);padding:4px 2px}
#pb{height:8px;background:#0006;border:2px solid #fff;margin:2px 0 6px}#pi{display:block;height:100%;width:0;background:#4fd0ff}
#stage{position:relative;border:4px solid #000;outline:4px solid #fff;box-shadow:8px 8px 0 #000;touch-action:none;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#120a2acc;padding:8px;overflow:auto}
.card{background:#2a1b52;border:4px solid #000;outline:3px solid var(--acc);box-shadow:inset 0 0 0 3px #4a3a8a,6px 6px 0 #000;padding:12px 14px;max-width:680px;width:100%;max-height:100%;overflow:auto;font-size:14px;line-height:1.45}
h1,h2{font:15px/1.5 "Press Start 2P",monospace;color:var(--acc);margin:0 0 10px}
button{font:10px/1.4 "Press Start 2P",monospace;background:var(--acc);color:#1b1035;border:0;padding:10px 12px;margin:4px 4px 0 0;cursor:pointer;box-shadow:inset -3px -3px 0 #c9971a,inset 3px 3px 0 #fff5,3px 3px 0 #000;text-align:left}
button.m{display:block;width:100%}
button.o{background:#fff;display:block;width:100%;margin:6px 0;font:700 14px system-ui,sans-serif;padding:9px 10px}
button.ok{background:var(--ok)}button.bad{background:var(--bad);color:#fff}
.ref{font-size:12px;margin:6px 0;padding-left:8px;border-left:3px solid var(--acc)}.ref a{color:#9be7ff}
.card{touch-action:pan-y;-webkit-overflow-scrolling:touch}
html,body{overscroll-behavior:none;overflow-x:hidden;touch-action:none}
@media (orientation:portrait) and (max-width:700px),(max-height:500px){#hint{display:none}}
#hud{padding:2px}
#hud button{min-width:38px;min-height:34px;padding:6px 8px;margin:0 0 0 4px}
button{min-height:40px}button.o{min-height:46px}
.tip{background:#1b1035;border:3px solid #4fd0ff;padding:8px 10px;margin:6px 0 8px}.tip p{margin:6px 0;font-size:15px;min-height:3.8em}
#tb{height:5px;background:#fff2}#tb i{display:block;height:100%;background:#4fd0ff;animation:tb 7s linear forwards}
@keyframes tb{from{width:0}to{width:100%}}
.ttl{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.ttl .l{text-align:center}.big{font:22px/1.3 "Press Start 2P",monospace;color:var(--acc);text-shadow:3px 3px 0 #000,0 0 14px #ffd23f55;margin:6px 0}
.sb{margin:0 0 8px;color:#9be7ff;font-size:13px}
.mas{display:flex;justify-content:center;align-items:flex-end;gap:12px;min-height:60px}.mas img{animation:bn 1.1s steps(4) infinite}.mas img:nth-child(2){animation-delay:.25s}.mas img:nth-child(3){animation-delay:.5s}
@keyframes bn{50%{transform:translateY(-8px)}}
.dev{background:#1b1035;border:3px solid #4a3a8a;padding:8px 10px;font-size:12px}.dev b{display:block;font:9px/1.5 "Press Start 2P",monospace;color:var(--acc);margin-bottom:6px}
.dev div{padding:4px 0;border-bottom:1px dotted #fff3}.dev div:last-child{border:0}.dev span{display:block;color:#9be7ff;font-family:monospace;font-size:11px}
@media (max-width:600px){.ttl{grid-template-columns:1fr}.big{font-size:18px}}
#rot{display:none;font-size:12px;color:var(--acc);margin:6px 2px}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
@media (max-width:600px){#hud{font-size:8px}.card{font-size:13px;padding:10px}h1,h2{font-size:12px}button{font-size:9px}button.o{font-size:13px}}
@media (max-height:420px){.card{font-size:12px;padding:8px}h1,h2{font-size:11px;margin-bottom:6px}.tip p{min-height:0}p{margin:4px 0}}

function start(){P={x:50,y:G-12,vy:0,rot:0,on:true,inv:0};O=[];PA.length=0;qc=0;SH=0;sc=0;lives=3;gems=0;cc=0;score=0;lastSp=0;speed=125*S[ph].sp0;st='play';hide();music(ph);hud()}

function done(){st='over';mi=-1;const s=cc>=4?3:cc>=3?2:1;prog.s[ph]=Math.max(prog.s[ph],s);if(ph<2)prog.u=Math.max(prog.u,ph+1);save();
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,f,.15),i*130));
 let h=`<h2>FASE ${ph+1} COMPLETA! ${'★'.repeat(s)}${'☆'.repeat(3-s)}</h2><p>Acertos: ${cc}/4 · Pontos: ${Math.floor(score)}</p>`;
 PQ[ph].forEach(i=>Q[i].r.forEach(r=>h+=refH(r)));
 h+=ph<2?`<button onclick="intro(${ph+1})">▶ PRÓXIMA FASE</button>`:'<p><b>🏆 Você terminou o jogo! Parabéns, super-escovador!</b></p>';
 show(h+`<button onclick="intro(${ph})">↻ REPETIR</button><button onclick="menu()">☰ MENU</button>`)}
function quiz(){st='quiz';const i=PQ[ph][gems/3-1],q=Q[i];sfx(880,1320,.12);
 show(`<h2>💠 PERGUNTA ${gems/3}/${NEED/3}</h2><p><b>${q.q}</b></p>`+q.o.map((o,k)=>`<button class="o" data-k="${k}">${o}</button>`).join(''));
 ov.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k==q.a;ov.querySelectorAll('.o').forEach(n=>{n.disabled=true;if(+n.dataset.k==q.a)n.classList.add('ok')});
  if(ok){cc++;score+=50;if(lives<3)lives++;sfx(660,990,.15)}else{b.classList.add('bad');sfx(200,120,.25);lives--}hud();

 if(ph>0)p.push([ho(0,34)],[fl(0)],[ho(0,38),gm(15,40)],[fl(0),fl(45)],[sp(0),fl(50)]);

 if(R()<.7)O.push(gm(wd+speed*.28,34+R()*8));
 lastSp=-wd;gap=speed*(.62+R()*.4-ph*.05)}
const hit=(a,b,m)=>a.x+m<b.x+b.w-m&&a.x+a.w-m>b.x+m&&a.y+m<b.y+b.h&&a.y+a.h-m>b.y+m;
function update(dt){
 speed=Math.min(125*S[ph].sp0+sc/70,205);const d=speed*dt;sc+=d;lastSp+=d;score+=d*.1;if(hold)jump();
 P.vy+=950*dt;P.y+=P.vy*dt;if(P.y>=G-12){P.y=G-12;P.vy=0;P.on=true;P.rot=0}else P.rot+=Math.PI*dt/.53;
 P.inv=Math.max(0,P.inv-dt);SH=Math.max(0,SH-dt*20);if(P.on&&Math.random()<.35)PA.push({x:P.x+2,y:G-1,vx:-30-Math.random()*30,vy:-15,l:.3,c:S[ph].ft});for(const p of PA){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.l-=dt}for(let i=PA.length;i--;)if(PA[i].l<=0)PA.splice(i,1);if(lastSp>gap)spawn2();
 const pb={x:P.x+1,y:P.y+1,w:10,h:10};
 for(const o of O){o.x-=d;if(o.t=='f')o.y=G-28+Math.sin(t*3+o.p)*11;const hb=o.t=='h'?{x:o.x+3,y:G-6,w:o.w-6,h:8}:o;
  if(o.t=='g'){if(hit(pb,o,-2)){o.dead=1;gems++;score+=10;burst(o.x+4,o.y+4,'#9be7ff',12);sfx(1000,1500,.1);hud();if(++qc>=3){qc=0;quiz();return}}}
  else if(!P.inv&&hit(pb,hb,o.t=='s'||o.t=='f'?2:1)){o.dead=1;lives--;P.inv=1.2;SH=5;burst(P.x+6,P.y+6,"#ff5d73",16);sfx(220,60,.25,"sawtooth");hud();if(lives<=0){over();return}}
  if(o.x<-30)o.dead=1}
 O=O.filter(o=>!o.dead)}

const PL=[".ooo....ooo.","ohhwoooowwgo","ohwwwwwwwwgo","owwwwwwwwwgo","owweewweewgo","owweywweywgo","owpwwwwwwpgo","owwwmmmmwwgo",".owwwwwwwgo.",".owwo..owgo.",".owgo..owgo.","..oo....oo.."];
const PP={o:"#2a1b52",w:"#fffdf5",h:"#ffffff",g:"#b9b3e0",e:"#2a1b52",y:"#fff",p:"#ff9db9",m:"#c2325a"};
const GM=["...oooo...","..olwwbo..",".olwwbbbo.","olwwbbbbdo","olwbbbbbdo","obbbbbbddo",".obbbbbdo.","..obbbdo..","...obdo...","....oo...."];
const GP={o:"#1a2c6a",l:"#fff",w:"#eaf8ff",b:"#a8dcff",d:"#5a9be0"};

const HR=[".rh.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."],HP1={r:"#ff3b5c",h:"#ffb3c0"},HP0={r:"#4a3a6a",h:"#4a3a6a"};
function layer(a){const [k,sz,col,hi,f]=a,gp=sz+26,off=(sc*f)%gp;
 for(let i=0;i<Math.ceil(W/gp)+2;i++){const bx=i*gp-off,h=sz+(i*7)%12;x.fillStyle=col;
  if(k=='tooth'){rc(bx,G-h,sz,h);rc(bx,G-h-5,sz/3,6);rc(bx+sz*2/3,G-h-5,sz/3,6);x.fillStyle=hi;rc(bx+3,G-h+2,2,h-8);x.fillStyle='#0002';rc(bx+sz-3,G-h,3,h)}
  else if(k=='mound'){const w2=sz*1.6;for(let y=0;y<sz;y+=2)rc(bx+(w2-w2*Math.sqrt(1-(y/sz)**2))/2,G-y-2,w2*Math.sqrt(1-(y/sz)**2),2);x.fillStyle=hi;rc(bx+w2*.3,G-sz*.7,3,2);rc(bx+w2*.3+3,G-sz*.7+2,2,2)}
  else if(k=='hang'){rc(bx,0,sz,h/2);rc(bx+2,h/2,sz-4,3);x.fillStyle=hi;rc(bx+2,0,2,h/2);x.fillStyle='#0002';rc(bx+sz-3,0,3,h/2)}
  else{for(let y=0;y<h*1.4;y+=2)rc(bx+6-12*(1-y/(h*1.4)*.85)/2,y,12*(1-y/(h*1.4)*.85),2);x.fillStyle=hi;rc(bx+6,0,1,h)}}}
function draw(){const s=S[ph];x.imageSmoothingEnabled=false;x.save();if(SH>0)x.translate(Math.round((Math.random()-.5)*SH),Math.round((Math.random()-.5)*SH));
 s.sky.forEach((k,i)=>{x.fillStyle=k;rc(0,i*G/4,W,G/4+1)});
 for(let i=1;i<4;i++){const b=i*G/4;x.fillStyle=s.sky[i];for(const [yo,sp,of] of [[6,4,0],[4,2,0],[2,2,1]])for(let xx=of;xx<W;xx+=sp)rc(xx,b-yo,1,2)}
 x.fillStyle=s.pc;for(let i=0;i<22;i++){const px=((i*53-sc*(.25+i%3*.1))%W+W)%W,py=G-8-((t*(6+i%4*2)+i*29)%100);x.globalAlpha=.5+.5*Math.sin(t*3+i);rc(px,py,i%3?1:2,i%3?1:2)}x.globalAlpha=1;
 layer(s.far);layer(s.mid);if(s.ceil)layer(s.ceil);
 x.fillStyle=s.fb;rc(0,G,W,H-G);x.fillStyle=s.fl;[0,1,2].forEach(r=>{rc(0,G+6+r*12,W,1);for(let k=-1;k<12;k++)rc(k*32+(r%2)*16-(sc%32),G+6+r*12,1,12)});
 for(let i=0;i<34;i++)rc(((i*37-sc)%W+W)%W,G+9+(i*13)%34,2,1);
 x.fillStyle='#0003';rc(0,G+4,W,3);x.fillStyle=s.ft;rc(0,G,W,4);for(let k=-1;k<42;k++)rc(k*8-(sc%8),G+4,5,2);x.fillStyle='#fffa';rc(0,G,W,1);
 for(const o of O){

  else if(o.t=='f'){const f=Math.sin(t*20)>0?0:2;x.fillStyle='#fffc';rc(o.x-3,o.y+f,4,3);rc(o.x+9,o.y+f,4,3);x.fillStyle='#fff6';rc(o.x-3,o.y+f+3,3,1);rc(o.x+10,o.y+f+3,3,1);spr(BC,BP,Math.round(o.x),Math.round(o.y))}

  else if(o.t=='s'){const tri=(ox,oy,m)=>{for(let r=0;r<10;r++){const w=2+(r>>1)*2-m*2;if(w>0)rc(ox+5-w/2,oy+r,w,1)}};

   x.fillStyle='#fff3';for(let r=2;r<9;r++)rc(o.x+5-(2+(r>>1)*2-2)/2,o.y+r+1,1,1);

   if(Math.sin(t*6+o.x)>.75){x.fillStyle='#fff';rc(gx+7,gy-2,1,4);rc(gx+6,gy-1,3,1)}}}
 for(const p of PA){x.globalAlpha=Math.min(1,p.l*3);x.fillStyle=p.c;rc(p.x,p.y,2,2)}x.globalAlpha=1;
 x.fillStyle='#0005';rc(P.x+(P.on?0:2),G+1,12-(P.on?0:2),2);
 if(!(P.inv>0&&Math.floor(P.inv*12)%2)){x.save();x.translate(Math.round(P.x+6),Math.round(P.y+6));x.rotate(Math.round(P.rot/(Math.PI/2))*Math.PI/2);
  spr(PL,PP,-5,-5,'#0006');spr(PL,PP,-6,-6);x.restore()}
 if(ph==2){const g=x.createRadialGradient(P.x+6,P.y,28,P.x+6,P.y,115);g.addColorStop(0,'rgba(0,0,8,0)');g.addColorStop(1,'rgba(0,0,8,.88)');x.fillStyle=g;rc(0,0,W,H)}
 else{const g=x.createRadialGradient(W/2,H/2,70,W/2,H/2,190);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,0,30,.35)');x.fillStyle=g;rc(0,0,W,H)}
 if(P.inv>1){x.fillStyle='#f003';rc(0,0,W,H)}
 x.restore();
 x.fillStyle='#000b';rc(0,0,W,13);x.fillStyle='#fff3';rc(0,13,W,1);for(let i=0;i<3;i++)spr(HR,i<lives?HP1:HP0,4+i*9,3);
 spr(GM,GP,47,1);x.fillStyle='#fff';x.font="6px 'Press Start 2P',monospace";x.fillText(gems+'/'+NEED,60,9);
